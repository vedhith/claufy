    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./styles.css" />

        <span class="wordmark">Claufy</span>
      </div>

      <div class="actions">
        <button id="add-term" title="New terminal (Cmd/Ctrl+T)">+ Terminal</button>
        <button id="add-term-dir" title="New terminal in a folder you pick">+ Folder…</button>
        <button id="add-page" title="Open a web page as a tile">+ Page</button>
        <div class="spacer"></div>
        <label class="mode">
          Focus
          <select id="mode">
            <option value="equal">Equal</option>
            <option value="grow" selected>Grow</option>
            <option value="solo">Solo</option>
          </select>
        </label>
        <label class="size" id="size-wrap">
          Size
          <input id="ratio" type="range" min="1.2" max="4" step="0.1" value="2.2" />
        </label>
      </div>
    </header>

    <main id="grid" aria-label="Tiles"></main>

    <div id="empty">
      <svg class="cat big" viewBox="0 0 512 512" shape-rendering="crispEdges" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#ffffff"/><rect x="128.00" y="64.00" width="32.50" height="32.50" fill="#000000"/><rect x="352.00" y="64.00" width="32.50" height="32.50" fill="#000000"/><rect x="96.00" y="96.00" width="32.50" height="32.50" fill="#000000"/><rect x="160.00" y="96.00" width="32.50" height="32.50" fill="#000000"/><rect x="320.00" y="96.00" width="32.50" height="32.50" fill="#000000"/><rect x="384.00" y="96.00" width="32.50" height="32.50" fill="#000000"/><rect x="64.00" y="128.00" width="32.50" height="32.50" fill="#000000"/><rect x="192.00" y="128.00" width="32.50" height="32.50" fill="#000000"/><rect x="288.00" y="128.00" width="32.50" height="32.50" fill="#000000"/><rect x="416.00" y="128.00" width="32.50" height="32.50" fill="#000000"/><rect x="64.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="96.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="128.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="160.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="192.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="224.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="256.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="288.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="320.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="352.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="384.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="416.00" y="160.00" width="32.50" height="32.50" fill="#000000"/><rect x="64.00" y="192.00" width="32.50" height="32.50" fill="#000000"/><rect x="416.00" y="192.00" width="32.50" height="32.50" fill="#000000"/><rect x="64.00" y="224.00" width="32.50" height="32.50" fill="#000000"/><rect x="96.00" y="224.00" width="       <p class="lead">Nothing open yet.</p>
      <p class="hint">Press <kbd id="newkey">Cmd</kbd>+<kbd>T</kbd> for a terminal, or use the buttons above.</p>
    </div>

    <dialog id="page-dialog">
      <form method="dialog">
        <h2>Open a page</h2>
        <input id="page-url" type="text" placeholder="https://localhost:3000" autocomplete="off" />
        <p class="note">
          Web pages tile inside Claufy. Native apps can't be embedded by any cross-platform app —
          those open in your OS instead.
        </p>
        <menu>
          <button value="cancel">Cancel</button>
          <button value="ok" id="page-ok" class="primary">Open</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" role="status"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
