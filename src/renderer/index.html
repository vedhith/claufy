<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Claufy</title>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="bar">
      <div class="brand">
        <svg class="cat" viewBox="0 0 48 48" aria-hidden="true">
          <path class="cat-ear" d="M11 19 L10 6 L22 13 Z" />
          <path class="cat-ear" d="M37 19 L38 6 L26 13 Z" />
          <ellipse class="cat-head" cx="24" cy="27" rx="16" ry="14" />
          <ellipse class="cat-eye" cx="18" cy="25" rx="2.4" ry="3.2" />
          <ellipse class="cat-eye" cx="30" cy="25" rx="2.4" ry="3.2" />
          <path class="cat-nose" d="M24 30.5 l-2.2 -2 h4.4 Z" />
          <path class="cat-mouth" d="M24 30.5 v2.2 M24 32.7 q-3 2.4 -5.6 0 M24 32.7 q3 2.4 5.6 0" />
          <path class="cat-whisker" d="M12 28 h-6 M12 31 h-5.5 M36 28 h6 M36 31 h5.5" />
        </svg>
        <span class="wordmark">Claufy</span>
      </div>

      <div class="actions">
        <button id="add-term" title="New terminal (Cmd/Ctrl+T)">+ Terminal</button>
        <button id="add-term-dir" title="New terminal in a folder you pick">+ Folder…</button>
        <button id="add-page" title="Open a web page as a tile">+ Page</button>
        <div class="spacer"></div>
        <label class="mode">
          Focus
          <select id="mode">
            <option value="equal">Equal</option>
            <option value="grow" selected>Grow</option>
            <option value="solo">Solo</option>
          </select>
        </label>
        <label class="size" id="size-wrap">
          Size
          <input id="ratio" type="range" min="1.2" max="4" step="0.1" value="2.2" />
        </label>
      </div>
    </header>

    <main id="grid" aria-label="Tiles"></main>

    <div id="empty">
      <svg class="cat big" viewBox="0 0 48 48" aria-hidden="true">
        <path class="cat-ear" d="M11 19 L10 6 L22 13 Z" />
        <path class="cat-ear" d="M37 19 L38 6 L26 13 Z" />
        <ellipse class="cat-head" cx="24" cy="27" rx="16" ry="14" />
        <ellipse class="cat-eye" cx="18" cy="25" rx="2.4" ry="3.2" />
        <ellipse class="cat-eye" cx="30" cy="25" rx="2.4" ry="3.2" />
        <path class="cat-nose" d="M24 30.5 l-2.2 -2 h4.4 Z" />
        <path class="cat-mouth" d="M24 30.5 v2.2 M24 32.7 q-3 2.4 -5.6 0 M24 32.7 q3 2.4 5.6 0" />
        <path class="cat-whisker" d="M12 28 h-6 M12 31 h-5.5 M36 28 h6 M36 31 h5.5" />
      </svg>
      <p class="lead">Nothing open yet.</p>
      <p class="hint">Press <kbd id="newkey">Cmd</kbd>+<kbd>T</kbd> for a terminal, or use the buttons above.</p>
    </div>

    <dialog id="page-dialog">
      <form method="dialog">
        <h2>Open a page</h2>
        <input id="page-url" type="text" placeholder="https://localhost:3000" autocomplete="off" />
        <p class="note">
          Web pages tile inside Claufy. Native apps can't be embedded by any cross-platform app —
          those open in your OS instead.
        </p>
        <menu>
          <button value="cancel">Cancel</button>
          <button value="ok" id="page-ok" class="primary">Open</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" role="status"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
