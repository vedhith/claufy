    <path d="M35.8 17.4 L36.6 5.6 L25.6 11.9 Z"/>
    <ellipse cx="24" cy="25.6" rx="15.2" ry="13.2"/>
  </g>

  <g transform="translate(256 272) scale(10.4) translate(-24 -25)" fill="#000000">
    <ellipse cx="18.2" cy="24.2" rx="2.3" ry="3.1"/>
